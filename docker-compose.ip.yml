services:
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_GRAPHQL_API_URL: ${NEXT_PUBLIC_GRAPHQL_API_URL}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - backend

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      - PORT=4003
      - CORS_ALLOWED_ORIGINS=${PUBLIC_ORIGIN}
    ports:
      - "${BACKEND_PORT:-4003}:4003"
    volumes:
      - ./backend/countries.sqlite:/app/countries.sqlite
